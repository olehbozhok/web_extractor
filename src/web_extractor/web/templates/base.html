<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web_extractor — {% block title %}Dashboard{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { color-scheme: light; }
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #f7f7f5; color: #1c1c1a; }
    header { background: #20242c; color: #f0f0ee; padding: 10px 24px; display: flex; gap: 24px; align-items: baseline; }
    header .brand { font-weight: 700; letter-spacing: 0.3px; }
    header a { color: #c9d1d9; text-decoration: none; }
    header a:hover { color: #ffffff; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 20px; } h2 { font-size: 16px; margin: 24px 0 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .card { background: #ffffff; border: 1px solid #dcdcd6; border-radius: 8px; padding: 12px 16px; }
    .card .value { font-size: 22px; font-weight: 600; }
    .card .label { color: #6b6b64; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    table { border-collapse: collapse; width: 100%; background: #ffffff; border: 1px solid #dcdcd6; }
    th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #ececea; font-size: 14px; }
    th { color: #6b6b64; font-weight: 600; background: #fbfbf9; }
    td.num, th.num { text-align: right; }
    .muted { color: #6b6b64; }
    .periods a { margin-right: 12px; text-decoration: none; color: #2b6cb0; }
    .periods a.active { font-weight: 700; color: #1a365d; }
    code, pre { font-family: ui-monospace, monospace; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <span class="brand">web_extractor</span>
  <a href="/">Dashboard</a>
  <a href="/events">Events</a>
  <a href="/agents">Agents</a>
  <a href="/cache">Cache</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
