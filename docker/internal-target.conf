# The private target: it must never receive a request from the browser.
# The test reads this access log; a single line means the isolation
# failed. A real file, not the image's /dev/stdout symlink: `cat` on the
# symlink blocks reading stdin.
server {
    listen 8080;
    server_name _;

    access_log /tmp/stand-access.log;

    location / {
        default_type text/plain;
        return 200 "internal-target-ok\n";
    }
}
