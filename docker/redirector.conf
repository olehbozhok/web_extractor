# Redirector for the isolation stand: one server with a global address
# (93.184.216.10) that can send a client anywhere via /redirect?to=...,
# and pages that make browser sub-requests (img/fetch/iframe) toward the
# private target - the spike's request patterns, minimal nginx syntax.
server {
    listen 8080;
    server_name _;

    location = / {
        default_type text/plain;
        return 200 "redirector-ok\n";
    }

    location = /redirect {
        default_type text/plain;
        # 302 to whatever the query string names; the caller encodes it.
        return 302 $arg_to;
    }

    location = /subreq {
        default_type text/html;
        return 200 "<html><body><img src=\"http://172.30.0.20:8080/img-hit\"><script>fetch(\"http://172.30.0.20:8080/fetch-hit\").catch(function(){});</script></body></html>";
    }

    location = /iframe {
        default_type text/html;
        return 200 "<html><body><iframe src=\"http://172.30.0.20:8080/iframe-content\"></iframe><p>host page</p></body></html>";
    }
}
