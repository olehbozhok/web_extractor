[project]
name = "web-extractor"
version = "0.1.0"
description = "Shared local web-fetching service for LLM agents: MCP interface, cache, extraction, event log, web UI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "fastapi",
    "httpx",
    "jinja2",
    "mcp",
    "pydantic",
    "pydantic-settings",
    "python-multipart>=0.0.33",
    "trafilatura",
    "uvicorn",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]
eval = [
    "openai>=3.48.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "web_extractor"
module-root = "src"

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals"]
mypy_path = "src"
python_version = "3.13"

[[tool.mypy.overrides]]
# The MCP SDK does not maintain re-export discipline (__all__), so importing
# its public helpers (e.g. create_mcp_http_client) needs implicit reexport
# for this dependency only.
module = "mcp.*"
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ holds historical spike records with embedded scripts; they are not
# linted code and must not be reflowed by the formatter.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "TRY",   # tryceratops
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
    "ASYNC", # flake8-async
    "PERF",  # perflint
    "ANN",   # flake8-annotations
    "T20",   # flake8-print
    "DTZ",   # flake8-datetimez
    "ERA",   # eradicate (commented-out code)
    "FBT",   # flake8-boolean-trap
]

[tool.ruff.lint.per-file-ignores]
# pytest provides no test mechanism without `assert`; S101 (bandit) targets
# production code that silently relies on asserts under -O. Narrow, documented
# exception limited to tests (AGENTS.md section 3 requires reporting exceptions).
"tests/**" = [
    "S101",
    # Magic values are the test data themselves (expected codes, ports, sizes).
    "PLR2004",
    # Test fixtures legitimately contain literals like "0.0.0.0"; bandit's
    # bind-to-all-interfaces heuristic misfires on them.
    "S104",
    # Test data builders take several optional fields; that is fixture code,
    # not API surface.
    "PLR0913",
    # Test fixtures carry stub credentials ("stub-token-for-tests"); bandit's
    # hardcoded-password heuristic targets real secrets.
    "S106",
]
"src/web_extractor/fetchers/http_fetcher.py" = [
    # The file overrides httpcore.AsyncNetworkBackend.connect_tcp, whose
    # signature (with a `timeout` parameter) is fixed by the httpcore API;
    # ASYNC109's asyncio.timeout advice does not apply to overrides.
    "ASYNC109",
]
"src/web_extractor/mcp_api/tools.py" = [
    # MCP tool signatures are the public API contract (docs/03): argument
    # names and shapes are fixed, so arg-count and builtin-shadowing rules
    # do not apply to the registered tool functions.
    "PLR0913",
    "PLR0917",
    "A002",
]
"src/web_extractor/web/routes.py" = [
    # Querystring parameters are the page's API (period, filters, sort,
    # pagination); each arrives as its own keyword argument. Bundling them
    # would fight FastAPI's binding mechanism.
    "PLR0913",
    "PLR0917",
]
"docker/browser/hc.py" = [
    # The healthcheck script opens a fixed http://127.0.0.1:11235 literal;
    # bandit's scheme-audit heuristic has nothing to guard here.
    "S310",
]
"tests/stand/stand.py" = [
    # Test infrastructure drives the docker CLI (fixed commands, no
    # untrusted input): bandit's subprocess heuristics don't apply.
    "S603",
    "S607",
]
"evals/run.py" = [
    # A CLI entry point: the report goes to stdout by design.
    "T20",
]
"src/web_extractor/config.py" = [
    # The host literal includes "0.0.0.0" for running inside a container,
    # where compose publishes the port on the host's 127.0.0.1; the security
    # decision is documented on the field itself (docs/02, section 7.1).
    "S104",
]


